// Builds the mod for obfuscated Minecraft versions (1.20.1 - 1.21.10).
// Shares sources and resources with the main (26.x) build in the parent directory;
// only the mixin differs per API variant (see src/<variant>/java).
//
// Build all:    ./gradlew -p legacy build
// Build one:    ./gradlew -p legacy :1.20.1:build
// Output jars:  out/<minecraft_version>/<jar>

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def mainProps = new Properties()
file('../gradle.properties').withInputStream { mainProps.load(it) }
def mainSrc = file('../src/main')

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom-remap'

	def mc = project.minecraft_version
	def javaVersion = project.java_version as int

	version = "${mainProps.mod_version}+${mc}"
	group = mainProps.maven_group

	base {
		archivesName = mainProps.archives_base_name
	}

	dependencies {
		minecraft "com.mojang:minecraft:${mc}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${mainProps.loader_version}"
	}

	sourceSets.main {
		java {
			srcDir new File(mainSrc, 'java')
			srcDir rootProject.file("src/${project.mixin_variant}/java")
			// The main build's mixin targets 26.x; use the variant one instead
			exclude { it.file.path.startsWith(new File(mainSrc, 'java/de/joker/mixin').path) }
		}
		resources.srcDirs = [new File(mainSrc, 'resources')]
	}

	processResources {
		def props = [
				version             : project.version,
				minecraft_dependency: mc,
				loader_dependency   : project.loader_dependency,
				java_version        : javaVersion,
				mixin_java_version  : javaVersion,
		]
		inputs.properties props

		filesMatching(["fabric.mod.json", "serverpingfixer.mixins.json"]) {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	jar {
		from(rootProject.file('../LICENSE')) {
			rename { "${it}_${mainProps.archives_base_name}" }
		}
	}

	def copyToOut = tasks.register('copyToOut', Copy) {
		from remapJar
		into rootProject.file("../out/${mc}")
	}

	build.finalizedBy copyToOut
}
